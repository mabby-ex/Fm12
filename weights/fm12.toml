# Player and staff scoring weights for FM2012.
# Score = sum(attribute * weight) / sum(weights). Attributes not listed count as 0.
#
# Players: the original FM27 weights (jamiebolden/fm-scoring) with FM12's attribute names (Jumping, Aerial Ability).
# FM12's match engine also rewards pace and acceleration heavily, so these are a reasonable start, but they have
# not been tested against FM12 yet: see fm12_notes.md for how to calibrate them.

[outfield.CB]
Acceleration = 5
Anticipation = 3
Composure = 2
Decisions = 1
"First Touch" = 1
Heading = 3
Jumping = 5
Pace = 5
Passing = 2
Positioning = 2
Stamina = 1
Strength = 3
Tackling = 1
"Work Rate" = 1

